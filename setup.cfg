[metadata]
name = dyana
version = 0.1.1
description = Molecular dynamics trajectory post-processing tools.
long_description = file: README.md
long_description_content_type = text/markdown
author = "Johannes Ingenmey"

[options]
python_requires = >=3.10
py_modules =
    main
    utils
packages = find:
install_requires =
    numpy
    scipy
    networkx
    matplotlib

[options.extras_require]
dev =
    pytest
    ruff

[options.entry_points]
console_scripts =
    dyana = main:cli

[options.packages.find]
include =
    analyses
    analyses.*
    core
    framework
    io_support
    workflow
